[project]
name = "dxlink-scanner"
version = "0.1.0"
description = "Real-time DXLink options volume scanner with CEL-based alert rules"
authors = [{ name = "rcapozzi" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "orjson>=3.10",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tastytrade>=0.1",
    "python-dotenv>=1.0",
    "typer>=0.9",
    "pyarrow>=15.0",
    "cel-expr-python>=0.1",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.13",
    "mypy>=1.7",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true


[[tool.mypy.overrides]]
module = [
    "tastytrade.*",
    "tastytrade.instruments.*",
    "tastytrade.session.*",
    "tastytrade.dxfeed.*",
    "tastytrade.streamer.*",
    "httpx.*",
    "yaml.*",
    "dotenv.*",
    "typer.*",
    "cel_expr_python.*",
    "pyarrow.*",
    "pandas.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=65"

[tool.coverage.run]
omit = [
    "tests/*",
]

[tool.uv]
package = true

[project.scripts]
dxlink-scanner = "dxlink_scanner.cli:app"
