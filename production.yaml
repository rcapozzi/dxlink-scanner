tastytrade:
  client_id: "${TASTY_CLIENT_ID}"
  client_secret: "${TASTY_CLIENT_SECRET}"
  refresh_token: "${TASTY_REFRESH_TOKEN}"
  sandbox: false

watchlist:
  default_alert_rules:
    - name: "absolute_size"
      expression: "trade.size >= 1000"
      severity: "critical"
    - name: "p95_raw_size"
      expression: "trade.is_option && trade.size >= config.p95_size"
      severity: "high"
    - name: "p95_delta_weighted"
      expression: "trade.is_option && trade.delta_weighted_size >= config.p95_delta_weighted_size"
      severity: "high"
    - name: "toxic_flow"
      expression: "stats.vpin > config.vpin_threshold && trade.delta_weighted_size > config.p95_delta_weighted_size"
      severity: "high"
    - name: "systemic_flow"
      expression: "config.systemic_score > 2.0"
      severity: "critical"
  tickers:
    - symbol: "SPY"
      option_type: "equity"
      expiration_filter: "0DTE"
      underlying_alert_rules:
        - name: "huge_option_print"
          expression: "trade.is_option && trade.size >= 90 && trade.price > .25"
          severity: "high"
        - name: "p95_delta_weighted_spy"
          expression: "trade.is_option && trade.delta_weighted_size >= config.p95_delta_weighted_size"
          severity: "high"
    - symbol: "SPX"
      option_type: "equity"
      expiration_filter: "0DTE"
      underlying_alert_rules:
        - name: "spx_large_print"
          expression: "trade.is_option && trade.size >= 50 && trade.price > 0.50"
          severity: "high"
    - symbol: "/ES"
      option_type: "futures"
      expiration_filter: "0DTE"
      underlying_alert_rules:
        - name: "large_option_print"
          expression: "trade.is_option && trade.size >= 5 && trade.price > 2.0"
          severity: "medium"

detection:
  size_mult: 2.0
  abs_min_size: 5
  stats_window: 50
  stats_half_life_sec: 600.0
  stats_session_aware: true
  cost_false_positive: 1.0
  cost_false_negative: 10.0
  cost_missed_regime_shift: 50.0
  fdr_alpha: 0.05
  fdr_lag: 0
  vol_low: 0.01
  vol_high: 0.03
  vol_crash: 0.05
  vol_target: 0.02
  vpin_threshold: 0.6
  vpin_window_buckets: 265
  vpin_bucket_volume: 1000
  p95_by_regime:
    low_vol:
      p95_size: 80
      p95_delta_weighted_size: 100000
    normal:
      p95_size: 120
      p95_delta_weighted_size: 200000
    high_vol:
      p95_size: 200
      p95_delta_weighted_size: 500000
    crash:
      p95_size: 500
      p95_delta_weighted_size: 1000000
  dynamic_thresholds:
    p95_size:
      expression: "bayesian_mean * 10"
      regime_adjustment:
        low_vol: 0.8
        normal: 1.0
        high_vol: 1.5
        crash: 2.0
      vol_target: true
    p95_delta_weighted_size:
      expression: "bayesian_mean * 1000"
      regime_adjustment:
        low_vol: 0.8
        normal: 1.0
        high_vol: 1.5
        crash: 2.0
    vpin_threshold:
      expression: "0.5 + rolling_std / 10"
      regime_adjustment:
        low_vol: 0.9
        normal: 1.0
        high_vol: 1.2
        crash: 1.5

outputs:
  stdout: true
  webhook:
    enabled: false
    url: "${WEBHOOK_URL}"
    timeout_seconds: 5
    max_retries: 3
  data_dir: "data/events"
  persist_events: true
  significance_thresholds_file: "data/events/significance_thresholds.json"
  models_state_file: "data/events/models_meta.json"

stream:
  backpressure_queue_size: 500
  flush_interval_sec: 300.0
  flush_batch_size: 1000

logging:
  level: "INFO"
  json_format: true